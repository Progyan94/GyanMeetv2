name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build React App
        working-directory: ./frontend
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Add Android Platform via Capacitor
        working-directory: ./frontend
        run: |
          npx cap sync android

      - name: Build APK with Gradle
        working-directory: ./frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        working-directory: ./frontend/android/app/build/outputs/apk/debug
        run: mv app-debug.apk gyanmeet.apk

      - name: Publish Direct APK Download
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          name: "Latest Build"
          body: "Automated direct download for the latest GyanMeet APK."
          artifacts: "frontend/android/app/build/outputs/apk/debug/gyanmeet.apk"
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
