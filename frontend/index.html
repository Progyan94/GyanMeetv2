<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>MeetXD | Free Open-Source Video Conferencing</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <!-- Essential SEO Meta Tags -->
    <meta name="description" content="MeetXD is a free, open-source video conferencing platform with high-quality WebRTC video, screen sharing, host anti-cheat controls, and custom backgrounds." />
    <meta name="keywords" content="video conferencing, free video calls, open source zoom alternative, google meet alternative, webrtc, anti-cheat video calls, MeetXD, GyanXD, virtual backgrounds, online meetings" />
    <meta name="author" content="GyanXD" />
    
    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://meetxd.vercel.app/" />
    <meta property="og:title" content="MeetXD | Free Open-Source Video Conferencing" />
    <meta property="og:description" content="Host free, unlimited video meetings with screen sharing, custom backgrounds, and unique anti-cheat controls for educators." />
    <meta property="og:image" content="https://meetxd.vercel.app/meetxd-og.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://meetxd.vercel.app/" />
    <meta name="twitter:title" content="MeetXD | Free Open-Source Video Conferencing" />
    <meta name="twitter:description" content="Host free, unlimited video meetings with screen sharing, custom backgrounds, and unique anti-cheat controls for educators." />
    <meta name="twitter:image" content="https://meetxd.vercel.app/meetxd-og.jpg" />

    <!-- Canonical Tag -->
    <link rel="canonical" href="https://meetxd.vercel.app/" />
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-gray-900 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
